# GRUB menu for hix
set timeout=5
set default=0

menuentry "hix - hi is not unix" {
	multiboot /boot/hix.elf hix.splash=on hix.quiet=on
	boot
}

menuentry "hix (verbose boot)" {
	multiboot /boot/hix.elf hix.splash=on hix.quiet=0
	boot
}

menuentry "hix (no splash, verbose)" {
	multiboot /boot/hix.elf hix.splash=0 hix.quiet=0
	boot
}

menuentry "hix (safe mode: shell only)" {
	multiboot /boot/hix.elf hix.safe=1
	boot
}

menuentry "hix (serial console on COM1)" {
	serial --unit=0 --speed=115200
	terminal_input serial
	terminal_output serial
	multiboot /boot/hix.elf hix.splash=0 hix.quiet=0
	boot
}
